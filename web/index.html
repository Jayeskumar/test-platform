<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crucible — technical assessments with a sandboxed multi-language judge, complexity analysis and integrity insights." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Crucible</title>
    <script>
      // Apply the saved theme before first paint (no flash). "system" follows the OS.
      (function () {
        try {
          var t = localStorage.getItem('crucible:theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
